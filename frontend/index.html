<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: Ohne das bleiben auf einem iPhone links und rechts
         schwarze Balken neben der Aussparung, sobald die App ohne Browserleiste
         läuft. Die Sicherheitsabstände holt das CSS über env(safe-area-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Eigenes YouTube-Archiv – Kanäle, Playlists und Videos aus dem eigenen Speicher." />

    <!-- Färbt die Systemleiste. Zwei Angaben, weil die Oberfläche beiden
         Erscheinungsbildern folgt. -->
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />

    <!-- iOS wertet das Manifest bis heute nur teilweise aus: Name, Icon und der
         Start ohne Browserleiste kommen dort aus diesen Angaben. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vitrine" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Vitrine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
