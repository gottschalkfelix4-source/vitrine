line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE", "RUF"]
ignore = [
  "E501",    # Zeilenlaenge regelt der Formatierer
  "RUF001",  # Umlaute und Gedankenstriche in deutschen Kommentaren sind gewollt
  "RUF002",
  "RUF003",
  "B008",    # FastAPI-Abhaengigkeiten stehen per Konvention im Vorgabewert
  "SIM103",  # Schutzklauseln sind lesbarer als eine negierte Sammelbedingung
]
