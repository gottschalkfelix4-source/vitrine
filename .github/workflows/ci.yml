name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ein laufender Durchlauf wird abgebrochen, wenn schnell hintereinander
# gepusht wird - das Ergebnis des aelteren Standes interessiert dann niemanden.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Die Tests der Archivierungskette rufen echtes ffmpeg auf und
      # ueberspringen sich sonst stillschweigend - dann waere der gruene Haken
      # wertlos.
      - name: ffmpeg installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Abhaengigkeiten
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Linter
        working-directory: backend
        run: ruff check app tests

      - name: Tests
        working-directory: backend
        run: pytest -q

      # Sicherheitsnetz gegen einen unbemerkten Rueckfall: Ohne FTS5 faellt die
      # Suche auf einfaches Vergleichen zurueck und die Tests wuerden trotzdem
      # gruen - deshalb hier ausdruecklich nachsehen.
      - name: FTS5 vorhanden
        working-directory: backend
        run: |
          python - <<'PY'
          import sqlite3, sys
          con = sqlite3.connect(":memory:")
          try:
              con.execute("CREATE VIRTUAL TABLE t USING fts5(a, tokenize='trigram')")
          except sqlite3.OperationalError as e:
              sys.exit(f"FTS5 mit Trigram fehlt: {e}")
          print("FTS5 mit Trigram-Tokenizer vorhanden")
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten
        working-directory: frontend
        run: npm ci

      - name: Typpruefung
        working-directory: frontend
        run: npx tsc --noEmit

      # Die Typpruefung sagt nur, dass die Formate zueinander passen, nicht ob
      # sie stimmen. Geprueft wird deshalb, was sich nicht aus den Typen
      # ergibt: dass das Qualitaetsetikett an der Hoehe misst und nicht an der
      # kuerzeren Seite, dass Bytes in 1024er-Schritten rechnen und dass
      # fehlende Werte nichts erfinden.
      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Bauen
        working-directory: frontend
        run: npm run build

  container:
    name: Container
    runs-on: ubuntu-latest
    # Erst bauen, wenn Backend und Frontend fuer sich stimmen - sonst wartet
    # man mehrere Minuten auf einen Fehler, den die schnellen Jobs schon kennen.
    needs: [backend, frontend]
    permissions:
      contents: read
      # Zum Veroeffentlichen des Images auf GitHub Container Registry.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vitrine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Der eigentliche Zweck dieses Jobs: pruefen, dass im Container alles
      # liegt, was der Betrieb braucht. Eine fehlende JavaScript-Laufzeit faellt
      # sonst erst auf, wenn yt-dlp stillschweigend 360p liefert.
      - name: Werkzeuge im Image
        run: |
          docker run --rm vitrine:ci sh -c '
            set -e
            ffmpeg  -version | head -1
            ffprobe -version | head -1
            deno --version | head -1
            python -c "import yt_dlp, yt_dlp_ejs; print(\"yt-dlp\", yt_dlp.version.__version__, \"mit EJS-Solver\")"
          '

      - name: Container startet und antwortet
        run: |
          docker run -d --name pruefling -p 8000:8000 vitrine:ci
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/health >/dev/null && break
            sleep 2
          done
          echo "--- Gesundheit ---"
          curl -sf http://127.0.0.1:8000/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          echo "--- Oberflaeche wird ausgeliefert ---"
          curl -sf http://127.0.0.1:8000/ | grep -qi "<title>"
          echo "--- Tiefe Links landen in der Anwendung, nicht im 404 ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/kanaele)" = "200"
          echo "--- Fehlende Dateien bleiben ehrliche 404 ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/assets/gibtsnicht.js)" = "404"
          docker logs pruefling
          docker rm -f pruefling

      # Veroeffentlichen nur nach einem Push auf main, nie fuer Pull Requests.
      # Das Image landet auf GitHub Container Registry - von dort zieht es das
      # Unraid-Template. Der Build kommt aus dem Cache des Schritts oben.
      - name: Anmeldung bei GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image veroeffentlichen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
